<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجرة من الحب من أجلك</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #020005;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay UI Elements */
        .card-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 320px;
            background: rgba(20, 10, 25, 0.85);
            border: 1px solid rgba(255, 105, 180, 0.4);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 20px;
            color: #fff;
            text-align: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .card-modal h2 {
            color: #ff69b4;
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 8px rgba(255, 105, 180, 0.6);
        }

        .card-modal p {
            font-size: 0.95rem;
            color: #e0d0e0;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .btn-action {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-action:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.8);
        }

        .subtitle {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 5px;
            letter-spacing: 1px;
        }
    </style>
    <!-- Three.js and OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Interactive Card Modals -->
    <div id="modal-intro" class="card-modal active">
        <h2>مجرة من الحب من أجلك</h2>
        <div class="subtitle">عيد ميلاد سعيد، يا حياتي</div>
        <br><br>
        <button class="btn-action" onclick="closeModal('modal-intro')">ادخل إلى عالمنا</button>
    </div>

    <div id="modal-card" class="card-modal">
        <h2 id="modal-title">لكِ</h2>
        <p id="modal-body">لأجلكِ أنتِ، من تجعلين قلبي ينبض بطريقة فريدة. في كل ذكرى وفي كل نبضة، أنتِ موجدة.</p>
        <button class="btn-action" onclick="closeModal('modal-card')">عودة ❤️</button>
    </div>

    <script>
        // --- 1. Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020005, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 60;
        controls.minDistance = 5;

        // --- 2. Galaxy Particle System ---
        const galaxyParams = {
            count: 35000,
            size: 0.015,
            radius: 20,
            branches: 4,
            spin: 1,
            randomness: 0.5,
            insideColor: '#ff2d75',
            outsideColor: '#4b0082'
        };

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(galaxyParams.count * 3);
        const colors = new Float32Array(galaxyParams.count * 3);

        const colorInside = new THREE.Color(galaxyParams.insideColor);
        const colorOutside = new THREE.Color(galaxyParams.outsideColor);

        for (let i = 0; i < galaxyParams.count; i++) {
            const i3 = i * 3;
            const radius = Math.random() * galaxyParams.radius;
            const spinAngle = radius * galaxyParams.spin;
            const branchAngle = ((i % galaxyParams.branches) / galaxyParams.branches) * Math.PI * 2;

            const randomX = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * galaxyParams.randomness * radius;
            const randomY = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * galaxyParams.randomness * radius;
            const randomZ = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * galaxyParams.randomness * radius;

            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            positions[i3 + 1] = randomY;
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            const mixedColor = colorInside.clone();
            mixedColor.lerp(colorOutside, radius / galaxyParams.radius);

            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: galaxyParams.size,
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true
        });

        const galaxyPoints = new THREE.Points(geometry, material);
        scene.add(galaxyPoints);

        // --- 3. Floating 3D Heart Mesh System ---
        const shape = new THREE.Shape();
        const x = 0, y = 0;
        shape.moveTo(x + 0.25, y + 0.25);
        shape.bezierCurveTo(x + 0.25, y + 0.25, x, y, x, y - 0.25);
        shape.bezierCurveTo(x, y - 0.55, x - 0.35, y - 0.77, x - 0.7, y - 0.77);
        shape.bezierCurveTo(x - 1.05, y - 0.77, x - 1.3, y - 0.45, x - 1.3, y - 0.15);
        shape.bezierCurveTo(x - 1.3, y + 0.25, x - 0.7, y + 0.6, x, y + 1.0);
        shape.bezierCurveTo(x + 0.7, y + 0.6, x + 1.3, y + 0.25, x + 1.3, y - 0.15);
        shape.bezierCurveTo(x + 1.3, y - 0.45, x + 1.05, y - 0.77, x + 0.7, y - 0.77);
        shape.bezierCurveTo(x + 0.35, y - 0.77, x, y - 0.55, x, y - 0.25);

        const extrudeSettings = { depth: 0.1, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
        const heartGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        heartGeo.center();
        heartGeo.rotateZ(Math.PI);

        const heartMat = new THREE.MeshBasicMaterial({ color: 0xff1493, wireframe: true });
        const heartGroup = [];

        for (let i = 0; i < 70; i++) {
            const heartMesh = new THREE.Mesh(heartGeo, heartMat);

            heartMesh.userData = {
                radius: 4 + Math.random() * 14,
                angle: Math.random() * Math.PI * 2,
                ySpeed: 0.006 + Math.random() * 0.012,
                yOffset: (Math.random() - 0.5) * 6,
            };

            heartMesh.position.x = Math.cos(heartMesh.userData.angle) * heartMesh.userData.radius;
            heartMesh.position.z = Math.sin(heartMesh.userData.angle) * heartMesh.userData.radius;
            heartMesh.position.y = heartMesh.userData.yOffset;

            heartMesh.scale.setScalar(0.2 + Math.random() * 0.3);

            scene.add(heartMesh);
            heartGroup.push(heartMesh);
        }

        // --- 4. Central Large Pulsing Heart Outline ---
        const bigHeartPoints = [];
        for (let t = 0; t <= Math.PI * 2; t += 0.05) {
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            bigHeartPoints.push(new THREE.Vector3(hx * 0.2, hy * 0.2 + 2, 0));
        }
        const bigHeartGeo = new THREE.BufferGeometry().setFromPoints(bigHeartPoints);
        const bigHeartMat = new THREE.LineBasicMaterial({ color: 0xff69b4, linewidth: 2 });
        const bigHeartLine = new THREE.LineLoop(bigHeartGeo, bigHeartMat);
        scene.add(bigHeartLine);

        // --- 5. Orbiting Text / Message Nodes (Bigger Text & Sprites) ---
        const messages = [
            "عيد سعيد لنا يا نونو حقتي 🥹", 
            "سحرتيني بعيونك 🤤", 
            "حب حياتي",
            "حبي الأبدي", 
            "اعشقك للجنون يا عشقي 🥹☹️", 
            "انا و انتي للابد يا حياتيي🥹"
        ];

        function createTextCanvas(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            // Higher resolution canvas for crisp larger text
            canvas.width = 512;
            canvas.height = 128;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'Bold 38px Segoe UI, Tahoma, sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ff1493';
            ctx.shadowBlur = 12;
            ctx.fillText(text, 256, 75);
            return canvas;
        }

        const textGroup = new THREE.Group();
        messages.forEach((msg, idx) => {
            const canvas = createTextCanvas(msg);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);

            const angle = (idx / messages.length) * Math.PI * 2;
            const dist = 11;
            sprite.position.set(Math.cos(angle) * dist, (Math.random() - 0.5) * 2, Math.sin(angle) * dist);
            
            // Increased sprite scale from (4, 1, 1) to (8, 2, 1)
            sprite.scale.set(8, 2, 1);
            textGroup.add(sprite);
        });
        scene.add(textGroup);

        // --- 6. Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            galaxyPoints.rotation.y = elapsedTime * 0.05;

            heartGroup.forEach((heartMesh) => {
                heartMesh.userData.angle += heartMesh.userData.ySpeed;
                heartMesh.position.x = Math.cos(heartMesh.userData.angle) * heartMesh.userData.radius;
                heartMesh.position.z = Math.sin(heartMesh.userData.angle) * heartMesh.userData.radius;
                heartMesh.position.y = heartMesh.userData.yOffset + Math.sin(elapsedTime * 2 + heartMesh.userData.radius) * 0.5;
                heartMesh.rotation.y += 0.02;
                heartMesh.rotation.x += 0.01;
            });

            const pulse = 1 + Math.sin(elapsedTime * 3) * 0.08;
            bigHeartLine.scale.set(pulse, pulse, pulse);

            textGroup.rotation.y = -elapsedTime * 0.03;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 7. UI / Modal Handlers ---
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updatePrecisionMatrix ? camera.updatePrecisionMatrix() : camera.updateMatrix();
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
