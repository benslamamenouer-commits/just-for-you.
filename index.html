
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #05020a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .start-btn {
      position: relative;
      z-index: 10;
      padding: 20px 30px;
      border: 2px solid #ff3b6f;
      border-radius: 12px;
      background: rgba(20, 5, 15, 0.6);
      box-shadow: 0 0 25px rgba(255, 59, 111, 0.4);
      color: #ff3b6f;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    .start-btn svg {
      width: 40px;
      height: 40px;
      fill: #ff3b6f;
      display: block;
      margin: 0 auto 10px;
      filter: drop-shadow(0 0 8px #ff3b6f);
    }

    .start-btn span {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .text-overlay {
      position: absolute;
      z-index: 5;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .text-overlay.show {
      opacity: 1;
    }

    .text-overlay h1 {
      color: #ffffff;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #ff1a53, 0 0 30px #ff1a53;
      margin-bottom: 5px;
    }

    .text-overlay p {
      color: #e0b0ff;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(186, 85, 211, 0.6);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="start-btn" id="startBtn">
    <svg viewBox="0 0 24 24">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <span>Tap to Bloom</span>
  </div>

  <div class="text-overlay" id="textOverlay">
    <h1>LOVE YOU</h1>
    <p>UR DOING GREAT JOB</p>
    <p>AND ALSO IM PROUD OF YOU 🥹💜</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const textOverlay = document.getElementById('textOverlay');

    let width, height;
    let particles = [];
    let isBloomed = false;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Mathematical Heart Formula
    function getHeartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    class Particle {
      constructor(targetX, targetY) {
        this.x = width / 2;
        this.y = height / 2;
        this.targetX = targetX;
        this.targetY = targetY;
        this.speed = Math.random() * 0.03 + 0.015;
        this.progress = 0;
        this.size = Math.random() * 2 + 1;
        this.alpha = Math.random() * 0.7 + 0.3;
        this.color = `hsl(${320 + Math.random() * 40}, 100%, ${55 + Math.random() * 25}%)`;
      }

      update() {
        if (this.progress < 1) {
          this.progress += this.speed;
          this.x += (this.targetX - this.x) * this.speed * 2;
          this.y += (this.targetY - this.y) * this.speed * 2;
        } else {
          this.x += Math.sin(Date.now() * 0.003 + this.targetX) * 0.3;
          this.y += Math.cos(Date.now() * 0.003 + this.targetY) * 0.3;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff1a53';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initHeartParticles() {
      particles = [];
      const totalParticles = 600;
      const scale = Math.min(width, height) / 45;

      for (let i = 0; i < totalParticles; i++) {
        const t = (Math.PI * 2 / totalParticles) * i;
        const point = getHeartPoint(t);
        
        const layerScale = scale * (0.5 + Math.random() * 0.5);
        const targetX = width / 2 + point.x * layerScale;
        const targetY = height / 2 + point.y * layerScale;

        particles.push(new Particle(targetX, targetY));
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 2, 10, 0.2)';
      ctx.fillRect(0, 0, width, height);

      if (isBloomed) {
        particles.forEach(p => {
          p.update();
          p.draw();
        });
      }

      requestAnimationFrame(animate);
    }

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      isBloomed = true;
      initHeartParticles();
      
      setTimeout(() => {
        textOverlay.classList.add('show');
      }, 1200);
    });

    animate();
  </script>
</body>
</html>
